<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第1の部屋 - 動く静止画</title>
    <style>
        body {
            margin: 0; background-color: #111; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            font-family: sans-serif; color: #fff;
        }
        /* 🚀 完全に静止しているのに、目を動かすとウネウネ動く錯視背景 */
        .illusion-wall {
            width: 80%; height: 60vh; max-width: 600px;
            background: repeating-conic-gradient(#000 0% 5%, #fff 5% 10%, #555 10% 15%);
            background-size: 40px 40px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 12px;
        }
        .btn-back {
            margin-top: 30px; padding: 12px 24px; background: none; border: 1px solid #fff;
            color: #fff; border-radius: 6px; cursor: pointer; text-decoration: none; transition: 0.3s;
        }
        .btn-back:hover { background: #fff; color: #000; }
    </style>
</head>
<body>
    <h1>第1の部屋：動く静止画</h1>
    <p>中央の模様を見つめながら、視線を周囲に泳がせてみてください。</p>
    <div class="illusion-wall"></div>
    <a href="index.html" class="btn-back">← ロビーに戻る</a>
</body>
</html>
