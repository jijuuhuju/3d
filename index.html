<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密の地下通路</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 3D空間の視野を設定 */
        .stage {
            perspective: 350px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        /* 4枚の壁を完全に1つに合体させた立体通路（チューブ） */
        .tunnel {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            /* 2秒で綺麗に繋がる位置まで手前に引き抜き、無限ループさせます */
            animation: moveTunnel 2s linear infinite;
        }

        /* すべての面（左・右・床・天井）の共通サイズと質感（明るさを調整） */
        .face {
            position: absolute;
            width: 400px;
            height: 2400px; /* 途切れないように十分な奥行きの長さを確保 */
            /* 💡 壁全体を明るめのグレーに変更し、見えやすくしました */
            background-color: #524b47; 
            /* 💡 奥の暗闇へ向かうグラデーションをなだらかにし、手前をしっかり明るく設定 */
            background-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 60%);
        }

        /* 左壁：中心から左へ200px離して90度回転 */
        .left {
            transform: rotateY(90deg) translateZ(-200px) translateY(-1000px);
        }

        /* 右壁：中心から右へ200px離して-90度回転 */
        .right {
            transform: rotateY(-90deg) translateZ(-200px) translateY(-1000px);
            /* 💡 右壁は少し明るさを変えて立体的な角がはっきり見えるように設定 */
            background-color: #5c5450; 
        }

        /* 床：中心から下へ200px離して-90度回転 */
        .floor {
            transform: rotateX(-90deg) translateZ(-200px) translateY(1000px);
            background-color: #3b3532;
        }

        /* 天井：中心から上へ200px離して90度回転 */
        .ceiling {
            transform: rotateX(90deg) translateZ(-200px) translateY(1000px);
            background-color: #47403d;
        }

        /* 🔄 継ぎ目なく滑らかに無限ループさせるためのアニメーション移動量 */
        @keyframes moveTunnel {
            0% {
                transform: translateZ(0px);
            }
            100% {
                transform: translateZ(1200px); /* 1ループで進む完璧な距離 */
            }
        }

        /* 最奥の中央に固定され、吸い込まれ続ける暗闇 */
        .portal {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- 奥の暗闇（トンネルの出口）を中央に固定 -->
        <div class="portal"></div>

        <!-- 4枚の壁が最初から一体化している無限トンネル -->
        <div class="tunnel">
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="face floor"></div>
            <div class="face ceiling"></div>
        </div>
    </div>

</body>
</html>
