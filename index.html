<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密の地下通路</title>
    <style>
        body {
            margin: 0;
            background-color: #050303;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 3Dのカメラ視野を設定 */
        .stage {
            perspective: 600px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 廊下のコンテナ */
        .corridor {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
        }

        /* レンガ壁・床・天井の共通アニメーション設定 */
        .wall, .floor, .ceiling {
            position: absolute;
            /* 🚀 一定の速度で無限に背景を動かすアニメーション（3秒で1ループ） */
            animation: walkForward 3s linear infinite;
        }

        /* 赤レンガ壁のデザイン */
        .wall {
            width: 1200px;
            height: 400px;
            background-color: #4a231c;
            background-image: 
                linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.4) 50%),
                linear-gradient(rgba(0,0,0,0.4) 50%, transparent 50%);
            background-size: 60px 30px; /* 横幅60pxで1ループする模様 */
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
        }

        /* 左のレンガ壁 */
        .left-wall {
            transform: rotateY(90deg) translateZ(-200px) translateX(-600px);
        }

        /* 右のレンガ壁 */
        .right-wall {
            transform: rotateY(-90deg) translateZ(-200px) translateX(600px);
        }

        /* 床（暗い石畳風） */
        .floor {
            width: 400px;
            height: 1200px;
            background: repeating-linear-gradient(#111 0px, #111 40px, #050505 41px, #050505 45px);
            background-size: 100% 45px; /* 縦幅45pxで1ループ */
            transform: rotateX(90deg) translateZ(-200px) translateY(-600px);
            box-shadow: inset 0 0 100px rgba(0,0,0,1);
            animation-name: walkFloor; /* 床専用の縦移動アニメーション */
        }

        /* 天井（暗闇） */
        .ceiling {
            width: 400px;
            height: 1200px;
            background: #0d0908;
            transform: rotateX(-90deg) translateZ(-200px) translateY(600px);
            box-shadow: inset 0 0 100px rgba(0,0,0,1);
            animation-name: walkCeiling; /* 天井専用の縦移動アニメーション */
        }

        /* 🔄 【壁の無限移動】背景のレンガ模様を横にスライドさせて前進を表現 */
        @keyframes walkForward {
            0% { background-position: 0px 0; }
            100% { background-position: -60px 0; } /* レンガ1個分（60px）奥へ流す */
        }

        /* 🔄 【床の無限移動】 */
        @keyframes walkFloor {
            0% { background-position: 0 0px; }
            100% { background-position: 0 -45px; } /* 石畳1個分奥へ流す */
        }

        /* 🔄 【天井の無限移動】 */
        @keyframes walkCeiling {
            0% { background-position: 0 0px; }
            100% { background-position: 0 -45px; }
        }

        /* 奥に見える地下への暗闇（固定配置） */
        .portal {
            position: absolute;
            width: 120px;
            height: 160px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255,255,255,0.05);
            transform: translateZ(-1100px) translateY(80px);
            box-shadow: 0 0 30px rgba(0,0,0,1);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="corridor">
            <div class="wall left-wall"></div>
            <div class="wall right-wall"></div>
            <div class="floor"></div>
            <div class="ceiling"></div>
            <div class="portal"></div>
        </div>
    </div>

</body>
</html>
