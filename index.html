<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯視の無限地下通路</title>
    <style>
        /* 画面全体を真っ黒に固定 */
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 🚀 脳をバグらせる錯視の部屋 */
        .illusion-room {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 白と黒の四角形が奥に向かって無限に吸い込まれていく幾何学グラデーション */
            background-image: 
                radial-gradient(circle at center, transparent 20%, #000 20%, #000 40%, transparent 40%, transparent 60%, #000 60%, #000 80%, transparent 80%),
                linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%, #fff),
                linear-gradient(45deg, #fff 25%, #000 25%, #000 75%, #fff 75%, #fff);
            background-size: 100px 100px;
            background-position: 0 0, 0 0, 50px 50px;
            
            /* 💡 中心に向かって強烈なパース（立体感）をつけるための特殊エフェクト */
            mask-image: radial-gradient(circle at center, transparent 10%, #000 90%);
            -webkit-mask-image: radial-gradient(circle at center, transparent 10%, #000 90%);

            /* 2秒間で模様が中央にシュッと吸い込まれ続けるアニメーション */
            animation: tunnelFly 2s linear infinite;
        }

        /* 🔄 模様のサイズを「大 ➔ 小」へループさせることで、自分が奥へ猛スピードで進んでいるように錯覚させます */
        @keyframes tunnelFly {
            0% {
                background-size: 160px 160px;
                filter: contrast(150%) hue-rotate(0deg);
            }
            100% {
                background-size: 80px 80px;
                filter: contrast(150%) hue-rotate(360deg);
            }
        }

        /* 中央の吸い込み口（固定された一番奥の暗闇） */
        .center-blackhole {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #000;
            border-radius: 50%;
            /* ほんのり怪しく光らせて吸い込み感を強調 */
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.2); 
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 最奥の中心点 -->
    <div class="center-blackhole"></div>

    <!-- 1枚の背景だけで錯覚を起こすトンネル空間 -->
    <div class="illusion-room"></div>

</body>
</html>
