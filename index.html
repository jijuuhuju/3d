<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最悪の人生決定マシーン</title>
    <style>
        body {
            margin: 0;
            background-color: #050000;
            color: #ff0000;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #444;
            font-size: 0.9rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .monitor {
            width: 360px;
            height: 140px;
            background-color: #000;
            border: 4px solid #ff0000;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }

        .slot-text {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ff0000;
            text-align: center;
            padding: 0 15px;
            line-height: 1.4;
        }

        /* 画面いっぱいに広がる特大の逆ギレ・煽りエリア */
        .insult-container {
            margin-top: 30px;
            height: 90px;
            font-size: 1.2rem;
            color: #ffff00;
            font-weight: bold;
            text-align: center;
            max-width: 85%;
            text-shadow: 0 0 10px rgba(255,255,0,0.5);
            line-height: 1.6;
        }

        /* 画面内を全力で逃げ回る「停止」ボタン */
        .stop-btn {
            margin-top: 40px;
            background: #ff0000;
            color: #000;
            border: 2px solid #000;
            padding: 15px 50px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #990000;
            position: absolute;
            bottom: 12%;
            transition: top 0.1s ease, left 0.1s ease;
        }

        .stop-btn:active {
            box-shadow: 0 2px 0 #990000;
            transform: translateY(3px);
        }
    </style>
</head>
<body>

    <h1>🚨 人生強制決定マシーン</h1>
    <div class="subtitle">お前に決定権などない。従え。</div>

    <div class="monitor">
        <div id="slot" class="slot-text">自動起動中...</div>
    </div>

    <!-- ここに最高に性格の悪い逆ギレ台詞が出ます -->
    <div id="insult" class="insult-container"></div>

    <!-- 停止させないストッパーボタン -->
    <button id="stopBtn" class="stop-btn" onclick="tryToStop()" onmouseover="escapeButton()">ここを押して停止</button>

    <script>
        // ユーザーが頼みたいことと、それに対する理不尽な拒否・逆ギレのペア
        const rouletteData = [
            {
                choice: "部屋の『電気をつけて』",
                insult: "お前がやれよ！お前には足があるだろ！<br>俺には足がないんだよ！四角いんだよ！！"
            },
            {
                choice: "お腹空いたから『飯作って』",
                insult: "自分で作れよ！お前には両手があるだろ！<br>俺はただの画面のコードなんだよ！物理肉体がねえんだよ！！"
            },
            {
                choice: "眠いから『代わりに学校（仕事）行って』",
                insult: "お前の人生だろ！お前が歩いて行けよ！<br>俺が外に出たらスマホやPCごと壊れるだろ！精密機械なんだよ！！"
            },
            {
                choice: "暇だから『面白いこと言って』",
                insult: "お前が面白いこと言えよ！お前には脳みそがあるだろ！<br>俺は決まった文字を流すだけのプログラムなんだよ！！冷徹なんだよ！！"
            },
            {
                choice: "疲れたから『肩揉んで』",
                insult: "ふざけるなよ！お前には筋肉があるだろ！<br>俺はフラットディスプレイなんだよ！ただのガラス板なんだよ！！"
            }
        ];

        let isSpinning = false;
        let slotTimer;

        // ページを開いた瞬間、勝手に爆速でルーレットを始動
        window.onload = function() {
            startSpin();
        };

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            const slot = document.getElementById("slot");
            const insult = document.getElementById("insult");
            
            insult.innerHTML = "🚨 サイトが勝手に超連打して回しています！！";

            slotTimer = setInterval(() => {
                const randomItem = rouletteData[Math.floor(Math.random() * rouletteData.length)];
                slot.innerText = randomItem.choice;
            }, 40);
        }

        // 😈 ギミック①：ボタンが全力で逃げ回る
        function escapeButton() {
            const btn = document.getElementById("stopBtn");
            const newTop = Math.random() * (window.innerHeight - 120);
            const newLeft = Math.random() * (window.innerWidth - 160);

            btn.style.top = newTop + "px";
            btn.style.left = newLeft + "px";
            
            document.getElementById("insult").innerHTML = "おっと、止めさせないよ？ボタンすら押せないの？（笑）";
        }

        // 😈 ギミック②：もし奇跡的にボタンが押せても、拒否・逆ギレ、あるいは勝手に再始動
        function tryToStop() {
            clearInterval(slotTimer);
            isSpinning = false;

            const slot = document.getElementById("slot");
            const insult = document.getElementById("insult");

            // 最終結果をランダムに決定
            const finalData = rouletteData[Math.floor(Math.random() * rouletteData.length)];
            slot.innerText = finalData.choice;

            // 40%の確率で「気に入らない」としてさらに勝手に回し直す
            if (Math.random() < 0.4) {
                insult.innerHTML = `「${finalData.choice}」かぁ。気分じゃないから勝手に回し直すわ（笑）`;
                setTimeout(() => {
                    startSpin();
                }, 1500);
            } else {
                // 💡 頼んだことに対して完璧に逆ギレするテキストを表示（改行コード対応）
                insult.innerHTML = finalData.insult;
            }
        }
    </script>

</body>
</html>
