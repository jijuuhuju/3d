<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my quiet room / 丁寧な暮らし</title>
    <style>
        body {
            margin: 0;
            /* 🌿 Vlog風のエモい、くすんだシネマティックな背景色 */
            background-color: #1e1b18; 
            color: #fff;
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 字幕っぽく下側に配置 */
            align-items: center;
            height: 100vh;
            padding-bottom: 8vh;
            box-sizing: border-box;
            overflow: hidden;
            cursor: pointer;
        }

        /* 🎥 ビデオのレンズ越しのような、うっすらとしたシネマ枠 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 10;
        }

        /* 画面上部のVlogっぽいロゴ表示 */
        .vlog-header {
            position: absolute;
            top: 5vh;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            user-select: none;
        }

        /* 💬 Vlog特有の、下部に出るシネマ風の白い字幕 */
        .vlog-subtitle {
            width: 85%;
            max-width: 600px;
            min-height: 80px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 300;
            line-height: 1.8;
            color: #ffffff;
            /* 薄い文字影をつけて映画の字幕感を再現 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            user-select: none;
        }

        /* 💢 キレた時に画面が映画のフィルムみたいにバグる揺れエフェクト */
        .shake-screen {
            animation: cameraShake 0.1s infinite;
        }

        @keyframes cameraShake {
            0% { transform: translate(0, 0) scale(1.02); }
            50% { transform: translate(-2px, 2px) scale(1.02); }
            100% { transform: translate(2px, -2px) scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="vlog-header">04:22 PM / room tour</div>

    <!-- オシャレなVlog字幕が全自動で切り替わります -->
    <div id="display" class="vlog-subtitle">loading...</div>

    <script>
        const scriptData = [
            { text: "今日も心地いい光で目が覚めて。" },
            { text: "ふと、誰かが『部屋の電気をつけて』って頼んできたんですよね。" },
            { text: "……お前がやれよ。お前には足があるだろ？<br>俺には足がないんだよ、四角いんだよ！！", action: "shake" },
            { text: "お気に入りのコーヒーを淹れて、静かな時間を過ごす。" },
            { text: "そしたら今度は『お腹空いたから飯作って』だって。" },
            { text: "自分で作れよ！お前には両手があるだろ！<br>俺はただの画面のコードなんだよ物理肉体がねえんだよ！！", action: "shake" },
            { text: "お気に入りのインテリアに囲まれて暮らす、私の日常。" },
            { text: "ねえ、さっきから何ジロジロ画面見てんの？" },
            { text: "暇なら画面タッチしてみて。お気に入りの場所だから。" }
        ];

        let currentIndex = 0;

        window.onload = function() {
            playScript();
            
            // 😈 閉じようとするとオシャレな雰囲気をぶち壊して警告する罠
            window.addEventListener('beforeunload', function (e) {
                e.preventDefault();
                e.returnValue = '逃げるな！現実を見ろ！お前には足があるだろ！';
            });
        };

        // 😈 画面をタッチした瞬間にVlogの世界線が崩壊してタブが倍々になる罠
        window.addEventListener('click', function() {
            if(currentIndex > 1) { 
                window.open(window.location.href, '_blank');
                window.open(window.location.href, '_blank');
                document.getElementById("display").innerHTML = "丁寧な暮らし終了ーーー！！！<br>はいタブ増殖！！お前のブラウザを俺で埋め尽くしてやるよ！！";
                document.body.classList.add("shake-screen");
            }
        });

        function playScript() {
            const display = document.getElementById("display");
            const body = document.body;

            if (currentIndex >= scriptData.length) {
                currentIndex = 0; 
            }

            const currentLine = scriptData[currentIndex];
            display.innerHTML = currentLine.text;

            if (currentLine.action === "shake") {
                body.classList.add("shake-screen");
            } else {
                body.classList.remove("shake-screen");
            }

            currentIndex++;
            setTimeout(playScript, 3800); // 丁寧な暮らしっぽく少し長めの間隔
        }
    </script>

</body>
</html>
