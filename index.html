<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯視の迷宮 - ILLUSION PORTAL</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🚀 失敗ゼロ：1枚の背景だけで奥へ進む錯視空間 */
        .bg-illusion {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-image: radial-gradient(circle at center, transparent 20%, #000 80%),
                              repeating-conic-gradient(#000 0% 15%, #fff 15% 30%);
            background-size: 100px 100px;
            background-position: center;
            animation: rotateTunnel 4s linear infinite;
            z-index: 1;
            opacity: 0.4; /* メニューの文字が見えやすいように少し薄く設定 */
        }

        /* 🔄 ぐるぐる回転しながら奥に吸い込まれるような錯覚を起こすアニメーション */
        @keyframes rotateTunnel {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        /* フロントのメニュー画面（3Dバグの影響を受けない安全なレイアウタ） */
        .content-overlay {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

        p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* メニューのボタン並び */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2列できれいに並べる */
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 部屋の入り口ボタン */
        .door-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* ボタンに触れたときのワクワク演出（怪しく光る） */
        .door-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 210, 0.6);
            transform: translateY(-3px);
        }

        /* スマホやiPad縦画面用の調整 */
        @media (max-width: 600px) {
            .menu-container {
                grid-template-columns: 1fr; /* 1列に並べる */
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- 背景の錯視アニメーション -->
    <div class="bg-illusion"></div>

    <!-- 前面のメニューコンテンツ -->
    <div class="content-overlay">
        <h1>👁️ 錯視の迷宮</h1>
        <p>画像は一切なし。コードだけで脳を騙す部屋へようこそ。</p>

        <div class="menu-container">
            <!-- 各部屋へのリンク（クリックすると別ページに飛ぶ設定にします） -->
            <a href="room1.html" class="door-btn">第1の部屋<br>「動く静止画」</a>
            <a href="room2.html" class="door-btn">第2の部屋<br>「歪む格子」</a>
            <a href="room3.html" class="door-btn">第3の部屋<br>「色の錯覚」</a>
            <a href="room4.html" class="door-btn">第4の部屋<br>「無限階段」</a>
        </div>
    </div>

</body>
</html>
