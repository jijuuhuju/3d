<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密の地下通路</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 3D空間の視野を設定（パースを調整して奥をしっかり見せます） */
        .stage {
            perspective: 350px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        /* 🚀 4枚の壁を完全に1つに合体させた立体通路（チューブ） */
        .tunnel {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            /* 2秒で綺麗に繋がる位置まで手前に引き抜き、無限ループさせます */
            animation: moveTunnel 2s linear infinite;
        }

        /* すべての面（左・右・床・天井）の共通サイズと質感（普通の無地） */
        .face {
            position: absolute;
            width: 400px;
            height: 2400px; /* 途切れないように十分な奥行きの長さを確保 */
            background-color: #2b2522; /* 落ち着いたコンクリート風のダークグレー */
            /* 奥に行くほど自然に暗くなる影のグラデーション */
            background-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.95) 70%);
        }

        /* 【確定】左壁：中心から左へ200px離して90度回転 */
        .left {
            transform: rotateY(90deg) translateZ(-200px) translateY(-1000px);
        }

        /* 【確定】右壁：中心から右へ200px離して-90度回転 */
        .right {
            transform: rotateY(-90deg) translateZ(-200px) translateY(-1000px);
            background-color: #2e2825; /* 左右でごくわずかに明度を変えて角を識別しやすく設定 */
        }

        /* 【確定】床：中心から下へ200px離して-90度回転 */
        .floor {
            transform: rotateX(-90deg) translateZ(-200px) translateY(1000px);
            background-color: #1c1817;
        }

        /* 【確定】天井：中心から上へ200px離して90度回転 */
        .ceiling {
            transform: rotateX(90deg) translateZ(-200px) translateY(1000px);
            background-color: #241f1d;
        }

        /* 🔄 継ぎ目なく滑らかに無限ループさせるためのアニメーション移動量 */
        @keyframes moveTunnel {
            0% {
                transform: translateZ(0px);
            }
            100% {
                transform: translateZ(1200px); /* 1ループで進む完璧な距離 */
            }
        }

        /* 最奥の中央に固定され、吸い込まれ続ける暗闇 */
        .portal {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- 奥の暗闇（トンネルの出口）を中央に固定 -->
        <div class="portal"></div>

        <!-- 4枚の壁が最初から一体化している無限トンネル -->
        <div class="tunnel">
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="face floor"></div>
            <div class="face ceiling"></div>
        </div>
    </div>

</body>
</html>
