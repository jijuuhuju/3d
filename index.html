<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密の地下通路</title>
    <style>
        body {
            margin: 0;
            background-color: #030202;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 3Dのカメラ視野を設定 */
        .stage {
            perspective: 500px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 廊下のコンテナ（前進するアニメーションをここで一括処理） */
        .corridor {
            position: relative;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            /* 🚀 廊下全体が奥から手前へループ移動することで、滑らかな自動前進を表現 */
            animation: moveCorridor 2s linear infinite;
        }

        /* すべての壁の基本設定（模様を消して、コンクリート風の無地にしました） */
        .wall-segment {
            position: absolute;
            background-color: #2b2522; /* 落ち着いたダークグレー */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8); /* 奥を暗く見せる影 */
        }

        /* 横の壁（左右対称に完全に固定） */
        .left-wall {
            width: 1200px;
            height: 400px;
            transform: rotateY(90deg) translateZ(-200px) translateX(-600px);
        }

        .right-wall {
            width: 1200px;
            height: 400px;
            transform: rotateY(-90deg) translateZ(-200px) translateX(600px);
        }

        /* 床と天井 */
        .floor {
            width: 400px;
            height: 1200px;
            background-color: #1a1615;
            transform: rotateX(90deg) translateZ(-200px) translateY(-600px);
        }

        .ceiling {
            width: 400px;
            height: 1200px;
            background-color: #221d1b;
            transform: rotateX(-90deg) translateZ(-200px) translateY(600px);
        }

        /* 🔄 奥行き（Z軸）をループさせて、ガタつかずに永遠に進ませる魔術 */
        @keyframes moveCorridor {
            0% { transform: translateZ(0px); }
            100% { transform: translateZ(400px); } /* 廊下のパーツ1個分だけ手前に引く */
        }

        /* 奥に見える固定された暗闇（吸い込まれる中心点） */
        .portal {
            position: absolute;
            width: 160px;
            height: 160px;
            background: #000;
            /* 廊下のアニメーションの影響を受けないように、stageの直下に配置します */
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- 奥の暗闇（トンネルの出口）を中央に固定 -->
        <div class="portal"></div>

        <!-- 自動で手前に流れ続ける立体廊下 -->
        <div class="corridor">
            <div class="wall-segment left-wall"></div>
            <div class="wall-segment right-wall"></div>
            <div class="wall-segment floor"></div>
            <div class="wall-segment ceiling"></div>
        </div>
    </div>

</body>
</html>
